name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build/requirements-build.txt

      - name: Build PingMonitor.exe
        run: python build/build_windows.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingMonitor-windows-exe
          path: dist/PingMonitor.exe
          if-no-files-found: error

      - name: Attach exe to release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if (gh release view NetworkTools) {
            gh release upload NetworkTools dist/PingMonitor.exe --clobber
          } else {
            gh release create NetworkTools dist/PingMonitor.exe --title "PingMonitor-src_V1.0" --latest
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
